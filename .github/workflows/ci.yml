name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android lint and APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Install Android build packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Lint and build both flavors
        run: ./scripts/check-android.sh
      - name: Upload development APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debug-apks-${{ github.sha }}
          path: android/app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-lint-${{ github.sha }}
          path: android/app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7

  edge-functions:
    name: Edge Function checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.6
      - run: deno fmt --check supabase/functions
      - run: deno lint supabase/functions
      - run: deno check --config supabase/functions/deno.json supabase/functions/health/index.ts
