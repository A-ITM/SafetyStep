<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>세이프티스탭 | Pleos 콘솔 동시 검증</title>
<style>
:root{color-scheme:dark;font:16px system-ui;color:#eef3ff;background:#0c1322}*{box-sizing:border-box}body{margin:0;padding:20px}header{display:flex;align-items:center;justify-content:space-between;height:46px;margin-bottom:14px}h1{font-size:23px;margin:0}h2{font-size:18px;margin:0}small,p{color:#a9b9d0}p{margin:8px 0;line-height:1.5}.grid{display:grid;grid-template-columns:40% 1fr;gap:18px}.panel{background:#172136;border:1px solid #30405b;border-radius:16px;padding:16px}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}iframe{width:142.857%;height:calc((100vh - 170px) / .7);transform:scale(.7);transform-origin:top left;border:0;border-radius:10px;background:#050a12}#screen{width:100%;display:block;aspect-ratio:16/9;cursor:crosshair;border-radius:10px}.input{margin-top:16px;border-top:1px solid #3b4b65;padding-top:16px}button{font:inherit;min-height:48px;padding:10px 18px;border:1px solid #49617e;border-radius:10px;color:#e8efff;background:#263956;cursor:pointer}button:hover{background:#35527c}.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.states{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.states div{background:#0c1526;border-radius:10px;padding:12px}.states small{display:block;margin-bottom:6px}.states b{font-size:18px}.case{border-left:3px solid #79b6ff;padding-left:12px}.note{font-size:13px}#error{color:#ffa99d}#log{font-size:14px;line-height:1.5;color:#a9b9d0;margin-top:12px}
.frame{height:calc(100vh - 170px);overflow:hidden;border-radius:10px}.input{margin-top:12px;padding-top:12px}#screen{max-width:calc((100vh - 460px) * 1.777778);margin-inline:auto}
</style>
<header><h1>세이프티스탭 <small>차량 연동 검증</small></h1><small>기존 Pleos 콘솔 · 실제 에뮬레이터 · 앱 보조 입력</small></header>
<div class="grid"><section class="panel"><div class="heading"><h2>Pleos Connect Virtual Console</h2><small>127.0.0.1:8088</small></div><div class="frame"><iframe src="http://127.0.0.1:8088/" title="기존 Pleos Connect Virtual Console"></iframe></div></section>
<main class="panel"><div class="heading"><h2 id="scene">차량 화면</h2><small>실제 Pleos · 좌측 차량 / 중앙 내비 / 우측 앱</small></div><img id="screen" alt="실제 Pleos 에뮬레이터 화면"><div class="states"><div><small>앱 화면</small><b id="phase">—</b></div><div><small>운전석 문</small><b id="door">—</b></div><div><small>트렁크</small><b id="trunk">—</b></div><div><small>응답 입력</small><b id="source">—</b></div></div>
<div class="input"><div class="heading"><h2>앱 보조 입력</h2><small>차량 신호는 왼쪽 기존 콘솔에서 조작</small></div><div class="row"><button onclick="act({command:'scenario',collision:'REAR'})">후방 충돌 상황</button><button onclick="act({command:'scenario',collision:'BREAKDOWN'})">차량 고장 상황</button><button onclick="act({command:'receiver'})">접근 차량</button><button onclick="act({command:'pcm'})">합성 음성 → 실제 STT</button><button onclick="act({command:'transcript',text:'저는 운전자예요. 움직일 수 있어요.'})">이동 가능 문장 입력</button><button onclick="act({command:'theme',value:'LIGHT'})">라이트</button><button onclick="act({command:'theme',value:'DARK'})">다크</button></div><p class="note">사고 이벤트·문장은 시험 입력입니다. 합성 음성 STT는 마이크 시험과 구분합니다. 착좌 신호는 SDK 호환성 문제로 앱 판정에서 제외합니다.</p><div class="case" id="log"></div><p id="error"></p></div></main></div>
<script>
const token='__TOKEN__';let busy=false;async function act(data){if(busy)return;busy=true;document.querySelector('#error').textContent='';try{const r=await fetch('/action',{method:'POST',headers:{'Content-Type':'application/json','X-Console-Token':token},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.error);}catch(e){document.querySelector('#error').textContent=e.message;}finally{busy=false;await state();}}
async function state(){try{const s=await(await fetch('/state')).json(),a=s.app;document.querySelector('#scene').textContent=s.scenario||'차량 화면';document.querySelector('#phase').textContent=s.appConnected?({DRIVE:'지원 대기',INTAKE:'상황 확인',RESPONSE:'응답 확인',MOBILITY:'이동 가능 확인',EVACUATION:'대피 준비',SUPPORT:'안전 확보 안내',HELP:'도움 요청',RECEIVER:'접근 차량',DRIVING:'주행 중 안내'})[a.screen]||a.screen:'앱 연결 확인';document.querySelector('#door').textContent=a.doorOpen===true?'열림':a.doorOpen===false?'닫힘':'—';document.querySelector('#trunk').textContent=a.trunk==='HELD'?'개방 보류':a.trunk==='CONFIRMED'?'열림 확인':a.trunkOpen===true?'열림':a.trunkOpen===false?'닫힘':'—';document.querySelector('#source').textContent=({OPERATOR_TEXT:'운영자 문장',SYNTHETIC_PCM:'합성 음성',MICROPHONE:'마이크'})[a.voiceInput]||'대기';document.querySelector('#log').textContent=s.event.title+' · '+s.event.detail;}catch(e){}}
const img=document.querySelector('#screen');img.onload=()=>setTimeout(()=>img.src='/screen.png?t='+Date.now(),300);img.onerror=()=>setTimeout(()=>img.src='/screen.png?t='+Date.now(),1000);img.src='/screen.png';img.onclick=e=>{const r=img.getBoundingClientRect();act({command:'tap',x:Math.floor((e.clientX-r.left)/r.width*2560),y:Math.floor((e.clientY-r.top)/r.height*1440)});};setInterval(state,700);state();
</script></html>
