<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>세이프티스탭 · 사고 차량의 안전 지원</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;color:#f0f5ff;background:#0b1220}*{box-sizing:border-box}body{margin:0;padding:24px}header{display:flex;align-items:center;justify-content:space-between;height:54px;margin-bottom:18px}h1{font-size:27px;margin:0}h1 span{font-size:19px;color:#aabbd1;font-weight:400;margin-left:20px}small{font-size:15px;color:#aabbd1}.layout{display:grid;grid-template-columns:31% 1fr;gap:22px;height:calc(100vh - 120px)}.left{display:flex;flex-direction:column;gap:18px;min-height:0}.panel{border:1px solid #2c3c54;border-radius:20px;background:#141f32;padding:20px;overflow:hidden}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}h2{font-size:20px;margin:0}.eyebrow{font-size:16px;color:#8fbaff;letter-spacing:.04em}#title{font-size:36px;margin:10px 0}#description{font-size:22px;color:#c2d0e2;line-height:1.55;margin:0;min-height:70px}.road{width:100%;height:auto;display:block;margin:12px 0 0}svg text{font-family:system-ui,sans-serif}.road .rear{transform:translateX(30px)}.road .burst{opacity:0}.road .walker{opacity:0}.road[data-phase=impact] .rear{animation:impact 1.3s ease-in forwards}.road[data-phase=impact] .burst{animation:flash 2s 1.15s forwards}.road[data-phase=stopped] .rear,.road[data-phase=safe] .rear{transform:translateX(270px)}.road[data-phase=stopped] .burst,.road[data-phase=safe] .burst{opacity:1}.road[data-phase=safe] .walker{opacity:1}.road[data-phase=driving] .dashes{animation:move 1s linear infinite}@keyframes impact{to{transform:translateX(270px)}}@keyframes flash{0%,40%,80%{opacity:1}20%,60%{opacity:.2}100%{opacity:1}}@keyframes move{to{stroke-dashoffset:56}}
.console{flex:1;min-height:330px}.console-frame{width:100%;height:calc(100% - 38px);overflow:hidden;border-radius:12px}.console-frame iframe{width:1240px;height:900px;border:0;transform-origin:top left;transform:scale(var(--console-scale,.57))}.vehicle{display:flex;flex-direction:column;min-height:0}#screen{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:contain;border-radius:12px;background:#05080e;min-height:0;flex:1}.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}.fact{background:#0b1424;border-radius:12px;padding:16px}.fact small{display:block;margin-bottom:8px}.fact strong{font-size:23px}.amber{color:#ffc675}#caption{min-height:60px;font-size:24px;line-height:1.4;margin:18px 0 0;padding-left:16px;border-left:3px solid #70aaff}.footer{margin-top:14px;display:flex;gap:16px;justify-content:space-between}.step-track{display:flex;gap:7px;margin:16px 0 0}.step{flex:1;height:5px;border-radius:5px;background:#2b3a52}.step.done{background:#76aeff}#error{color:#ffb0a5}#link{color:#74dfbf}.source{font-size:13px;line-height:1.5;color:#95a8c0;margin-top:12px}
.road[data-collision=FRONT] .rear use{color:#78abf8}.road[data-collision=FRONT] .rear text{fill:#bbd6ff}.road[data-collision=FRONT] #lead-car{color:#e58c7f}.road[data-collision=FRONT] #lead-label{fill:#efb3a9}.road[data-collision=FRONT] .walker{transform:translateX(-160px)}
</style>
<header><h1>세이프티스탭 <span>사고 대응 · 음성 안내와 차량 상태</span></h1><small id="story-context">고속도로 후방 충돌 · 안전 지원 흐름</small></header>
<div class="layout"><aside class="left"><section class="panel">
<div class="heading"><span class="eyebrow" id="step">01 / 06</span><small>상황 재현</small></div>
<h2 id="title">사고 전 주행</h2><p id="description">운전석·동승석 착좌, 사건 입력 없음.<br>기어와 속도로 주행 상태를 재현합니다.</p>
<svg class="road" id="road" viewBox="0 0 720 270" data-phase="driving" aria-label="후방 차량이 내 차량에 충돌하는 상황 재현 도식">
<defs><g id="car"><rect x="0" y="0" width="150" height="66" rx="20" fill="currentColor"/><rect x="33" y="7" width="66" height="52" rx="12" fill="#14263e"/><path d="M98 9L119 17V49L98 57Z" fill="#8ba8c9"/><rect x="21" y="-5" width="29" height="7" rx="3" fill="#030912"/><rect x="21" y="64" width="29" height="7" rx="3" fill="#030912"/><rect x="105" y="-5" width="27" height="7" rx="3" fill="#030912"/><rect x="105" y="64" width="27" height="7" rx="3" fill="#030912"/></g></defs>
<rect x="0" y="32" width="720" height="178" rx="16" fill="#27364d"/>
<path d="M0 75H720 M0 191H720" stroke="#bcc9db" stroke-width="3"/>
<path class="dashes" d="M0 125H720" stroke="#a4b3c9" stroke-width="3" stroke-dasharray="28 28"/>
<text x="522" y="22" fill="#a7b6cb" font-size="17">주행 방향 →</text>
<g class="rear"><use href="#car" x="0" y="93" color="#e58c7f"/><text x="75" y="181" text-anchor="middle" fill="#efb3a9" font-size="18" id="moving-label">후방 차량</text></g>
<use id="lead-car" href="#car" x="430" y="93" color="#78abf8"/><text id="lead-label" x="505" y="181" text-anchor="middle" fill="#bbd6ff" font-size="18">내 차량</text>
<g class="burst"><path d="M424 87L433 111L450 102L438 123L452 144L430 138L422 160L415 137L397 145L410 124L397 102L416 110Z" fill="#ffba67"/></g>
<rect x="0" y="231" width="720" height="39" rx="12" fill="#163b39"/><text x="18" y="257" fill="#93d8c7" font-size="17">차량에서 떨어진 안전한 곳</text>
<g class="walker"><circle cx="507" cy="251" r="8" fill="#c2ffea"/><circle cx="535" cy="251" r="8" fill="#c2ffea"/><path d="M510 205V229" stroke="#9ae8ca" stroke-width="3" stroke-dasharray="4 4"/><path d="M503 222L510 229L517 222" stroke="#9ae8ca" fill="none" stroke-width="3"/></g>
</svg>
<div class="step-track"> <span class="step"></span><span class="step"></span><span class="step"></span><span class="step"></span><span class="step"></span><span class="step"></span></div>

</section><section class="panel console"><div class="heading"><h2>Pleos Connect Virtual Console</h2><small>기존 콘솔</small></div><div class="console-frame"><iframe src="http://127.0.0.1:8088/" title="기존 Pleos 콘솔"></iframe></div></section></aside>
<main class="panel vehicle"><div class="heading"><h2>사고 차량 · 실제 Pleos 화면</h2><small>차량 상태 / 내비게이션 / 세이프티스탭</small></div><img id="screen" alt="실제 에뮬레이터 화면">
<div class="facts"><div class="fact"><small>주행 상태</small><strong id="motion">—</strong></div><div class="fact"><small>운전석 문</small><strong id="door">—</strong></div><div class="fact"><small>트렁크</small><strong id="trunk">—</strong></div><div class="fact"><small>비상등</small><strong id="phase">—</strong></div></div>
<p id="caption">사건 입력 전 · 기어와 속도에 따른 앱의 주행 화면을 확인합니다.</p>
<div class="footer"><small id="identity">발생 사건 없음</small><small id="link"></small></div>
<small id="implementation"></small><small id="error"></small>
</main></div>
<script>
const scenes={
 ready:[0,'사고 전 주행','운전석·동승석 착좌, 사건 입력 없음.\n기어와 속도로 주행 상태를 재현합니다.','사건 입력 전 · 기어와 속도에 따른 앱의 주행 화면을 확인합니다.'],
 driving:[0,'사고 전 주행','운전석·동승석 착좌, 사건 입력 없음.\n기어와 속도로 주행 상태를 재현합니다.','사건 입력 전 · 기어와 속도에 따른 앱의 주행 화면을 확인합니다.'],
 impact:[1,'후방 충돌 발생','뒤따르던 차량과 충돌.\n차량이 멈추고 안전 지원이 시작됩니다.','후방 충돌 발생. 정차 후 탑승자의 응답을 확인합니다.'],
 response:[2,'운전자 응답 확인','“제 말이 들리나요?”\n음성 응답을 확인합니다.','질문 안내 → 답변 인식 → 이동 가능 여부 확인'],
 mobility:[2,'움직일 수 있는지 확인','“스스로 움직일 수 있나요?”\n답변에 따라 지원을 나눕니다.','응답이 있다는 사실과 움직일 수 있는지를 따로 확인합니다.'],
 prepare:[3,'후방 충돌에 맞춘 대피 준비','트렁크 열기는 보류.\n차량 신호로 비트박스 상태가 갱신됩니다.','앱 터치 없이 음성 안내가 이어지고, 비상등·좌석·문 상태를 표시합니다.'],
 departure:[4,'안전한 곳으로 이동','문 열림이 차량 화면에 반영됩니다.\n탑승자가 좌석을 비우는 상황을 재현합니다.','탑승자의 이동을 확인하며 도로 위험 알림을 유지합니다.'],
 safe:[5,'하차 후 위험 알림 유지','차량으로 돌아가지 않도록 안내합니다.\n도로 위험 정보는 계속 유지합니다.','모든 좌석이 비면 차 밖에서의 안전 행동을 안내합니다. 도로 위험 알림은 계속됩니다.']};
let previous='';async function state(){try{
 const s=await(await fetch('/state')).json(),a=s.app,v=s.vehicle;let stage=s.story?.stage||'ready';
 const front=s.story?.collision==='FRONT';document.querySelector('#road').dataset.collision=front?'FRONT':'REAR';
 document.querySelector('#moving-label').textContent=front?'내 차량':'후방 차량';document.querySelector('#lead-label').textContent=front?'전방 차량':'내 차량';
 document.querySelector('#story-context').textContent=front?'고속도로 전방 충돌 · 후방 개방 공간 확인':'고속도로 후방 충돌 · 트렁크 개방 보류';
 document.querySelector('#road').setAttribute('aria-label',front?'내 차량이 앞 차량에 충돌하는 상황 재현 도식':'후방 차량이 내 차량에 충돌하는 상황 재현 도식');
 if(a.incidentId&&['ready','driving'].includes(stage))stage=({RESPONSE:'response',MOBILITY:'mobility',EVACUATION:'prepare',SUPPORT:'departure',MONITORING:'safe'})[a.screen]||stage;
 if(stage==='response'&&a.screen==='MOBILITY')stage='mobility';
 let [n,title,desc,caption]=scenes[stage]||scenes.ready; if(front&&stage==='impact'){title='전방 충돌 발생';desc='앞서 있던 차량과 충돌.\n정차 후 탑승자 지원을 시작합니다.';caption='정차와 후방 개방 공간이 확인된 상황으로 진행합니다.';}
 if(front&&stage==='prepare'){title='트렁크 자동 개방';desc='정차·후방 개방 공간 확인.\n앱이 트렁크를 열고 결과를 확인합니다.';caption='개방 버튼을 누르지 않아도 트렁크가 열리고, 실제 열림을 확인한 뒤 체크됩니다.';}
 if(stage==='departure'&&a.occupied===false&&a.cabinPresence==='OCCUPIED'){title='동승자 이동 지원';desc='운전자는 하차, 동승자는 차량 안.\n남아 있는 탑승자의 지원을 이어갑니다.';caption='좌석도에서 운전석은 자리 비움, 동승석은 탑승 중으로 자동 갱신됩니다.';}
 if(stage==='departure'&&a.cabinPresence==='EMPTY'){title='탑승자 이동 확인';desc='운전석·동승석의 비움이 반영됩니다.\n도로 위험 정보는 계속 유지합니다.';caption='동승자까지 좌석을 비우면 좌석별 상태가 함께 갱신됩니다.';}
 document.querySelector('#step').textContent=String(n+1).padStart(2,'0')+' / 06';document.querySelector('#title').textContent=title;document.querySelector('#description').innerText=desc;
 if(previous!==stage){document.querySelector('#road').dataset.phase=stage==='impact'?'impact':['ready','driving'].includes(stage)?'driving':stage==='safe'?'safe':'stopped';previous=stage;}
 document.querySelectorAll('.step').forEach((e,i)=>e.classList.toggle('done',i<=n));
 document.querySelector('#motion').textContent=(v.gear?.actual?.value==='Park'?'P':v.gear?.actual?.value==='Drive'?'D':'—')+' · '+Math.round(v.controls?.speed_kph||0)+' km/h';
 document.querySelector('#door').textContent=a.doorOpen===true?'열림':a.doorOpen===false?'닫힘':'—';
 document.querySelector('#trunk').textContent=a.trunk==='HELD'?'개방 보류 · '+(a.trunkOpen===false?'닫힘':a.trunkOpen===true?'열림':'상태 확인 중'):a.trunkOpen===true?'열림':a.trunkOpen===false?'닫힘':'—';document.querySelector('#trunk').className=a.trunk==='HELD'?'amber':'';
 document.querySelector('#phase').textContent=a.hazardLights===true?'작동 중 · 점멸 확인':a.hazardAction==='CHECKING'?'앱 자동 켜기 요청':a.hazardLights===false?'꺼짐':'상태 미확인';
 let live=caption;if(['response','mobility'].includes(stage)){if(a.voice==='SPEAKING')live=stage==='mobility'?'세이프티스탭: “스스로 움직일 수 있나요?”':'세이프티스탭: “제 말이 들리나요? 운전자 또는 동승자인지 말씀해 주세요.”';else if(a.voice==='LISTENING')live=stage==='mobility'?'운전자 응답: “움직일 수 있어요.”':'운전자 응답: “네, 들려요. 저는 운전자예요.”';}
 document.querySelector('#caption').textContent=live;
 document.querySelector('#identity').textContent=a.incidentId?'사건 '+a.incidentId.slice(0,8)+(front?' · 전방 충돌':' · 후방 충돌'):'발생 사건 없음';
 document.querySelector('#link').textContent=a.incidentId&&a.pending===0&&a.connected&&a.consent?'도로 위험 정보 공유 중':'';
 document.querySelector('#implementation').textContent=(a.hazardControlMode==='EMULATOR_CONSOLE'?'비상등 제어: 에뮬레이터 어댑터 · 상태 확인: Vehicle Service':'비상등 제어: Vehicle Service')+' · 음성 시험: 합성 음성 → 실제 STT';
 document.querySelector('#error').textContent=s.appConnected?'':'앱 연결 확인 중 · 아래 상태는 마지막 수신값입니다.';
}catch(e){document.querySelector('#error').textContent=e.message;}}
const img=document.querySelector('#screen');img.onload=()=>setTimeout(()=>img.src='/screen.png?t='+Date.now(),250);img.onerror=()=>setTimeout(()=>img.src='/screen.png?t='+Date.now(),1000);img.src='/screen.png';
function fit(){const frame=document.querySelector('.console-frame');frame.style.setProperty('--console-scale',frame.clientWidth/1240);}window.addEventListener('resize',fit);fit();setInterval(state,400);state();
</script></html>
