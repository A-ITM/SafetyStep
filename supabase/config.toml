project_id = "pleos-app"

# A public liveness probe only. It reads no data and calls no paid APIs.
# Do not reuse this authorization setting for application endpoints.
[functions.health]
enabled = true
verify_jwt = false
entrypoint = "./functions/health/index.ts"

# The handler also verifies the user with Supabase Auth and applies the two-user allowlist.
[functions.accidents]
enabled = true
verify_jwt = true
entrypoint = "./functions/accidents/index.ts"
